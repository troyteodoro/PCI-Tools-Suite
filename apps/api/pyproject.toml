[project]
name = "demarc"
version = "0.1.0"
description = "Demarc — PCI DSS evidence and scope tooling"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    # [email] pulls email-validator, required by the EmailStr fields in api.schemas.
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.1.1",
    "asyncpg>=0.30",
    "alembic>=1.20.0",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "arq>=0.26",
    "redis>=5.2",
    "httpx>=0.28",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
    # The compose files are an enforced part of the security boundary (which service is
    # handed which credential), so the tests parse them.
    "pyyaml>=6.0",
    "types-pyyaml>=6.0",
    # Generates requirements*.txt via `make lock`.
    "uv>=0.12.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demarc"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations run long and are not hand-formatted; E501 there is noise.
"alembic/**" = ["I001", "E501"]
"tests/**" = ["S105", "S106"]
# S105 flags the development defaults for secret_key and the S3 credentials. They are
# deliberate and named as such; validate_for_production() refuses to start if any of them
# survives into a production deployment, which is the real control.
"src/demarc/core/config.py" = ["S105"]

[tool.mypy]
python_version = "3.12"
strict = true
# Without this, mypy cannot see through Field() and reads every settings default as a
# plain assignment to the annotated type.
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    # Applied automatically to everything under tests/integration (see its conftest).
    # The default unit run excludes these with -m "not integration", so the offline
    # suite stays offline as DB-backed tests are added.
    "integration: requires a live Postgres",
]
