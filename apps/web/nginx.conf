server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runs unprivileged; nginx needs writable temp paths outside /var/cache.
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # The application must never be framed, and must never leak an evidence URL through
    # a referrer to a third party.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # No external origins at all: fonts are self-hosted or system, and there is no CDN.
    # A compliance tool that pulls resources from third parties is a poor advertisement
    # for requirement 6.4.3.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; the entry point never is.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
