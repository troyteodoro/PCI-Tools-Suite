<!doctype html>
<html lang="en" data-theme="modernist">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Demarc</title>
    <script>
      // Applied before first paint so the shell never flashes the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('demarc.theme');
          if (stored === 'modernist' || stored === 'nocturne') {
            document.documentElement.setAttribute('data-theme', stored);
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'nocturne');
          }
        } catch (e) {
          /* private browsing: fall back to the markup default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
