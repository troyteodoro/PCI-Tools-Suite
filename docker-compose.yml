# Base composition, shared by local and production.
#
# Local development layers compose.override.yml on top (applied automatically).
# Production uses:  docker compose -f docker-compose.yml -f compose.prod.yml up -d

name: demarc

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demarc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demarc}
      POSTGRES_DB: ${POSTGRES_DB:-demarc}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the least-privileged demarc_app role on first start. RLS only means
      # something because the application is not the table owner (docs/adr/0001).
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-demarc} -d ${POSTGRES_DB:-demarc}']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'no']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${DEMARC_S3_ACCESS_KEY_ID:-demarc}
      MINIO_ROOT_PASSWORD: ${DEMARC_S3_SECRET_ACCESS_KEY:-demarc-dev-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # One-shot: creates the evidence bucket and enables versioning, then exits.
  # Lives here rather than in the local override because production needs the bucket
  # too — evidence artifacts are content-addressed and immutable, and versioning is
  # what makes an accidental overwrite recoverable rather than silent.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${DEMARC_S3_ACCESS_KEY_ID:-demarc} ${DEMARC_S3_SECRET_ACCESS_KEY:-demarc-dev-secret} &&
      mc mb --ignore-existing local/${DEMARC_S3_BUCKET:-demarc-evidence} &&
      mc version enable local/${DEMARC_S3_BUCKET:-demarc-evidence} &&
      echo 'bucket ready'
      "
    restart: 'no'

  # One-shot: applies migrations as the OWNER role, then exits. Everything that touches
  # the database waits for this to succeed.
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    command: ['alembic', 'upgrade', 'head']
    environment:
      DEMARC_MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-demarc}:${POSTGRES_PASSWORD:-demarc}@postgres:5432/${POSTGRES_DB:-demarc}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    environment:
      DEMARC_ENVIRONMENT: ${DEMARC_ENVIRONMENT:-local}
      DEMARC_DEPLOYMENT_MODE: ${DEMARC_DEPLOYMENT_MODE:-single_tenant}
      DEMARC_SINGLE_TENANT_ORG_SLUG: ${DEMARC_SINGLE_TENANT_ORG_SLUG:-default}
      # Runtime connects as the least-privileged role, never the owner.
      DEMARC_DATABASE_URL: postgresql+asyncpg://demarc_app:${DEMARC_APP_DB_PASSWORD:-demarc_app}@postgres:5432/${POSTGRES_DB:-demarc}
      DEMARC_REDIS_URL: redis://redis:6379/0
      DEMARC_S3_ENDPOINT_URL: http://minio:9000
      DEMARC_S3_BUCKET: ${DEMARC_S3_BUCKET:-demarc-evidence}
      DEMARC_S3_ACCESS_KEY_ID: ${DEMARC_S3_ACCESS_KEY_ID:-demarc}
      DEMARC_S3_SECRET_ACCESS_KEY: ${DEMARC_S3_SECRET_ACCESS_KEY:-demarc-dev-secret}
      DEMARC_SECRET_KEY: ${DEMARC_SECRET_KEY:-dev-only-insecure-key-do-not-use-in-production-0000}
      DEMARC_CORS_ORIGINS: ${DEMARC_CORS_ORIGINS:-http://localhost:5173}
      DEMARC_LOG_LEVEL: ${DEMARC_LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.worker
    environment:
      DEMARC_ENVIRONMENT: ${DEMARC_ENVIRONMENT:-local}
      DEMARC_DEPLOYMENT_MODE: ${DEMARC_DEPLOYMENT_MODE:-single_tenant}
      DEMARC_DATABASE_URL: postgresql+asyncpg://demarc_app:${DEMARC_APP_DB_PASSWORD:-demarc_app}@postgres:5432/${POSTGRES_DB:-demarc}
      DEMARC_REDIS_URL: redis://redis:6379/0
      DEMARC_S3_ENDPOINT_URL: http://minio:9000
      DEMARC_S3_ACCESS_KEY_ID: ${DEMARC_S3_ACCESS_KEY_ID:-demarc}
      DEMARC_S3_SECRET_ACCESS_KEY: ${DEMARC_S3_SECRET_ACCESS_KEY:-demarc-dev-secret}
      DEMARC_SECRET_KEY: ${DEMARC_SECRET_KEY:-dev-only-insecure-key-do-not-use-in-production-0000}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
