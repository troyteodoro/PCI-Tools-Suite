# Grouped on purpose. Four ungrouped ecosystems is roughly fifteen pull requests a week
# on a solo project, which ends with the whole thing switched off. Minor and patch
# updates arrive as one PR per ecosystem; majors stay separate because they deserve to
# be read.
version: 2
updates:
  # Keeps the SHA pins in .github/workflows current. Pinning actions by SHA is the main
  # supply-chain control here, and it only works if something bumps them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  # Reads apps/api/requirements*.txt. The `>=` ranges in pyproject.toml alone gave
  # Dependabot nothing actionable — every future release already satisfies them.
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    groups:
      javascript:
        update-types: [minor, patch]

  # Base images: python:3.12-slim, node:22-alpine, nginx, postgres, redis, minio.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
    schedule:
      interval: weekly
      day: monday
    groups:
      images:
        update-types: [minor, patch]
